# Site
title: Alano
subtitle: "Code, systems, notes"
description: "祝愿平静的意志贯穿你我"
keywords:
author: Your Name
language: zh-CN
timezone: Asia/Shanghai

# URL
# 发布到 GitHub Pages 后，把这里改成你的实际地址：
# 本地开发可继续访问 http://localhost:4000
url: https://a1ano.github.io
root: /
permalink: posts/:year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ""

# Home
index_generator:
  path: ""
  per_page: 8
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 8
pagination_dir: page

# Extensions
theme: carbon-minimal

# Deployment
# 推荐使用 .github/workflows/pages.yml 自动部署。
deploy:
  type: git
  repo:
  branch: gh-pages
